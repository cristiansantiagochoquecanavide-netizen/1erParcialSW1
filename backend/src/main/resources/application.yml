spring:
  application:
    name: case-api
  config:
    import: optional:file:./.env[.properties], optional:file:../.env[.properties], optional:file:./backend/.env[.properties]
  profiles:
    default: dev
  flyway:
    enabled: true
    default-schema: case_tool
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: case_tool
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-safe-32-byte-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  ai:
    provider: ${AI_PROVIDER:groq}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:qwen/qwen3.8-27b}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}
