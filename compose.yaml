services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto-case-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-case_db}
      POSTGRES_USER: ${POSTGRES_USER:-case_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-case_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto-case-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-case_db}
      DB_USERNAME: ${POSTGRES_USER:-case_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-case_password}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost:8080"
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-safe-32-byte-minimum}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: proyecto-case-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
